name: 承認された記事を公開する

on:
  # Cloudflare Worker から repository_dispatch で起動される
  repository_dispatch:
    types: [publish-draft]
  workflow_dispatch:
    inputs:
      draft_id:
        description: "ドラフトID"
        required: true
      action:
        description: "approve または reject"
        required: true
        default: approve

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 公開または却下を実行
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m scripts.publish \
            --draft-id "${{ github.event.client_payload.draft_id || inputs.draft_id }}" \
            --action "${{ github.event.client_payload.action || inputs.action }}"

      - name: 変更をコミット
        env:
          DRAFT_ID: ${{ github.event.client_payload.draft_id || inputs.draft_id }}
          ACTION: ${{ github.event.client_payload.action || inputs.action }}
        run: |
          git config user.name "auto-blog"
          git config user.email "actions@github.com"
          commit() {
            git add content/ site/ keywords.json
            # 変更がない場合にワークフローを失敗させない
            if git diff --staged --quiet; then
              echo "コミットする変更はありません。"
              return 1
            fi
            git commit -q -m "publish: $DRAFT_ID"
          }
          commit || exit 0
          # 承認を続けて押すと、同時に動いた別の公開とぶつかる。
          # サイトのHTMLは記事から作り直せるので、最新の状態に合わせてから公開をやり直す
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "プッシュが競合しました。最新の状態から公開をやり直します（$i/5）"
            sleep $((i * 5))
            git fetch -q origin main
            git reset -q --hard origin/main
            python -m scripts.publish --draft-id "$DRAFT_ID" --action "$ACTION"
            commit || exit 0
          done
          echo "5回試しましたがプッシュできませんでした。" >&2
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub側の一時的な不具合で「アップロードしたサイトのデータが見つからない」と失敗することがある。
      # その場合は少し待って、もう一度だけ反映を試す
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 反映に失敗したので1分待つ
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - uses: actions/deploy-pages@v4
        if: steps.deploy.outcome == 'failure'
