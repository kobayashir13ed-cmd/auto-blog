name: サイトを再生成して公開する

# 記事の公開とは独立して、サイトだけを作り直したいときに使う。
# 例: デザインを変えた、static/ にファイルを足した、設定を変えた。
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 「Re-run」でやり直したときも、古い状態ではなく最新の記事からサイトを作る
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: サイトを生成
        run: python -m scripts.build_site

      - name: 生成結果をコミット
        run: |
          git config user.name "auto-blog"
          git config user.email "actions@github.com"
          git add site/
          if git diff --staged --quiet; then
            echo "サイトに変更はありません。"
            exit 0
          fi
          git commit -m "site: 再生成"
          # 実行中に記事の公開などが先に入ると押し返される。その場合は最新を取り込み、作り直してから押し直す
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "プッシュが競合しました。最新を取り込んで作り直します（$i/3）"
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.build_site
            git add site/
            git diff --staged --quiet && exit 0
            git commit -m "site: 再生成"
          done
          echo "3回試しましたがプッシュできませんでした。" >&2
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub側の一時的な不具合で「アップロードしたサイトのデータが見つからない」と失敗することがある。
      # その場合は少し待って、もう一度だけ反映を試す
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 反映に失敗したので1分待つ
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - uses: actions/deploy-pages@v4
        if: steps.deploy.outcome == 'failure'
