name: 記事ドラフトを生成して承認メールを送る

on:
  schedule:
    # 平日（月〜金）の朝7時（日本時間）。cron は UTC なので -9時間すると前日22:00 になり、
    # 曜日も1つ前へずれる（月→日=0 … 金→木=4）。よって日〜木 = 0-4 を指定する。
    - cron: "0 22 * * 0-4"
  workflow_dispatch:      # 手動実行用。最初のテストはこれで回す。

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      # 楽天の認証情報はここでは不要。商品一覧は読者のブラウザが取得するため、
      # 値は config.json の rakuten_client に置いてサイトのJSへ埋め込まれる。
      # 在庫が尽きると記事が作られなくなるため、少なくなったら先に補充する。
      # 在庫が足りているときはAPIを呼ばずに即終了するので、毎回走らせて問題ない。
      # ここで失敗しても記事生成は続ける（補充は次回でも間に合う）。
      - name: キーワードの在庫を確認し、少なければ補充する
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.research generate --min-stock 10 --count 12

      - name: ドラフトを生成
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.generate

      - name: ドラフトをコミット
        if: steps.gen.outputs.draft_id != ''
        run: |
          git config user.name "auto-blog"
          git config user.email "actions@github.com"
          git add content/ keywords.json
          git commit -m "draft: ${{ steps.gen.outputs.draft_id }}"
          git push

      # --- ここから下は auto_publish の設定で分岐する ---

      - name: 承認メールを送信（auto_publish が false のとき）
        if: steps.gen.outputs.draft_id != '' && steps.gen.outputs.auto_publish != 'true'
        env:
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python -m scripts.notify --draft-id "${{ steps.gen.outputs.draft_id }}"

      - name: そのまま公開（auto_publish が true のとき）
        if: steps.gen.outputs.draft_id != '' && steps.gen.outputs.auto_publish == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m scripts.publish \
            --draft-id "${{ steps.gen.outputs.draft_id }}" --action approve

      - name: 公開結果をコミット（auto_publish が true のとき）
        if: steps.gen.outputs.draft_id != '' && steps.gen.outputs.auto_publish == 'true'
        run: |
          git add content/ site/ keywords.json
          git diff --staged --quiet || git commit -m "publish: ${{ steps.gen.outputs.draft_id }}"
          git push

      - uses: actions/configure-pages@v5
        if: steps.gen.outputs.auto_publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gen.outputs.auto_publish == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.gen.outputs.auto_publish == 'true'
